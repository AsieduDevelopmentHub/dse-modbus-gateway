; DSE 7320 Modbus RTU MVP — ESP32-C3 SuperMini (native USB CDC)
[env:esp32-c3-supermini]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; SuperMini has no USB-UART bridge — Serial is native USB CDC/JTAG
board_build.mcu = esp32c3
board_build.f_cpu = 160000000L
board_build.flash_mode = qio
board_build.cdc_on_boot = 1

; Do NOT assert RTS/DTR — on native CDC this can hold/reset the chip
monitor_rts = 0
monitor_dtr = 0

build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -Isrc

monitor_filters = esp32_exception_decoder
; Host-side echo ON so PlatformIO monitor shows typed keys.
; Firmware also echoes (for PuTTY). If you see double letters in PIO, that's OK.
monitor_echo = yes
